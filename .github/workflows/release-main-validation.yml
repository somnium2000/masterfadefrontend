name: Release main validation
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  frontend:
    if: startsWith(github.head_ref, 'release/prod-') || github.head_ref == 'release/reconcile-main-dev-20261119' || github.head_ref == 'codex/pixelpay-public-3ds-integrated-20261120' || github.head_ref == 'codex/pixelpay-cardinal-origins-20261120' || github.head_ref == 'codex/pixelpay-stepup-diagnostics-20261120' || github.head_ref == 'codex/pixelpay-stepup-focus-cert'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      TZ: America/Tegucigalpa
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: D1
            ref: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - run: git rev-parse HEAD
      - name: Vitest (Node suites run separately)
        run: >-
          node node_modules/vitest/vitest.mjs run --maxWorkers=1
          --exclude test/accountDeletionClientFlow.test.js
          --exclude test/adminAccountDeletionFlow.test.js
          --exclude test/internalAccountDeletionFlow.test.js
      - run: npm run test:node
      - run: npm run lint
      - name: Verify the compiled PixelPay browser SDK offline
        run: node scripts/pixelpay-delegated-browser-bundle.mjs
      - run: npm run build
        env:
          VITE_CLIENT_BOOKING_ENABLED: 'false'
          VITE_PUBLIC_BOOKING_ENABLED: 'false'
          VITE_APP_URL: https://masterfadeapp.com
          VITE_PAYMENT_PROVIDER: pixelpay
          VITE_PIXELPAY_ENV: live
          VITE_CLIENT_CITAS_ENABLED: 'true'
          VITE_CLIENT_PLAN_PURCHASE_ENABLED: 'false'
          VITE_VIP_MEMBERSHIPS_ENABLED: 'true'
          VITE_VIP_MEMBERSHIPS_PURCHASE_ENABLED: 'false'
      - run: git diff --check
      - name: Chromium StepUp, legal and consent review
        env:
          MASTERFADE_BROWSER_URL: http://127.0.0.1:4211
          MASTERFADE_BROWSER_ENGINES: chromium
          MASTERFADE_LEGAL_EVIDENCE: ${{ runner.temp }}/mf-legal-evidence
        run: |
          npm install --prefix "$RUNNER_TEMP/mf-legal-browser" --no-package-lock --no-audit --no-fund --ignore-scripts playwright@1.64.1
          node "$RUNNER_TEMP/mf-legal-browser/node_modules/playwright/cli.js" install --with-deps chromium
          export MASTERFADE_PLAYWRIGHT_MODULE="$RUNNER_TEMP/mf-legal-browser/node_modules/playwright"
          node scripts/pixelpay-native-stepup-browser.mjs
          npm run preview -- --host 127.0.0.1 --port 4211 --strictPort > "$RUNNER_TEMP/mf-legal-preview.log" 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4211/ > /dev/null; then break; fi
            sleep 1
          done
          node --test --test-concurrency=1 test/legalTerms.browser.mjs test/releaseLegalConsent.browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release11-legal-chromium
          path: ${{ runner.temp }}/mf-legal-evidence
          if-no-files-found: ignore
          retention-days: 7
